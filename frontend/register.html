<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Simple Blog</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Navigation Bar ===== -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">SimpleBlog</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li id="navLogin"><a href="login.html">Login</a></li>
        <li id="navRegister"><a href="register.html">Register</a></li>
        <li id="navDashboard"><a href="dashboard.html">Dashboard</a></li>
        <li id="navCreate"><a href="create-blog.html">Create Blog</a></li>
        <li id="navLogout"><a href="#">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== Page Content ===== -->
  <main class="container">
    <div class="card form-card">
      <h2 class="page-title">Register</h2>

      <div class="alert" id="registerAlert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="Your name">
          <span class="error-text" id="regNameError"></span>
        </div>

        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com">
          <span class="error-text" id="regEmailError"></span>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="At least 6 characters">
          <span class="error-text" id="regPasswordError"></span>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" placeholder="Re-enter your password">
          <span class="error-text" id="regConfirmError"></span>
        </div>

        <button type="submit" class="btn btn-block">Create Account</button>
      </form>

      <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 SimpleBlog. Built for learning purposes.</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
